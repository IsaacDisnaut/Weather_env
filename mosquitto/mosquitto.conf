# ---------------------------------------------------------------------------
# Mosquitto config สำหรับทดสอบในวง LAN (ใช้ภายใน ไม่ตั้ง user/pass)
#
# รันด้วย:
#   "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto\mosquitto.conf -v
#
# ค่าเริ่มต้นของ mosquitto 2.x จะรับเฉพาะ localhost ไฟล์นี้เปิดให้อุปกรณ์
# ในวง LAN (เช่น ESP32) ต่อเข้ามาได้ด้วย
# ---------------------------------------------------------------------------

# MQTT ปกติ — สำหรับอุปกรณ์และ Next.js server
listener 1883 0.0.0.0
allow_anonymous true

# MQTT over WebSocket — เผื่ออยากให้เบราว์เซอร์หรือ Node-RED ต่อตรง
listener 9001 0.0.0.0
protocol websockets

# เก็บ log ไว้ดูว่าอุปกรณ์ต่อเข้ามาและส่ง topic อะไรบ้าง
log_type all
connection_messages true

# ให้ retained message และ session อยู่ข้ามการรีสตาร์ท
persistence true
persistence_location mosquitto/
